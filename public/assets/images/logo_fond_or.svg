<?xml version="1.0" encoding="UTF-8"?>
<svg width="550" height="250" viewBox="0 0 550 250" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="goldBackground" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#d4b876;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#c9a961;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#b89650;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="blueText" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#1e5a8e;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0f3a5c;stop-opacity:1" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- Fond or dégradé -->
    <rect width="550" height="250" fill="url(#goldBackground)"/>
    
    <!-- Ornements géométriques modernes -->
    <g id="ornements-geometriques">
        <rect x="180" y="45" width="60" height="3" rx="1.5" fill="#ffffff" opacity="0.6"/>
        <rect x="310" y="45" width="60" height="3" rx="1.5" fill="#ffffff" opacity="0.6"/>
        <polygon points="275,35 270,45 280,45" fill="#ffffff" opacity="0.8"/>
        <circle cx="255" cy="45" r="5" fill="#ffffff" opacity="0.8"/>
        <circle cx="295" cy="45" r="5" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- Texte VITE en bleu foncé -->
    <text x="275" y="110" font-family="'Garamond', 'Georgia', serif" font-size="60" font-weight="bold"
          fill="url(#blueText)" text-anchor="middle" letter-spacing="6" filter="url(#glow)">VITE</text>
    
    <!-- & stylisé avec cercle bleu -->
    <circle cx="275" cy="145" r="25" fill="#0f3a5c" opacity="0.9"/>
    <text x="275" y="155" font-family="'Brush Script MT', cursive" font-size="38"
          fill="#ffffff" text-anchor="middle" font-style="italic" font-weight="bold">&amp;</text>
    
    <!-- Texte GOURMAND en bleu foncé -->
    <text x="275" y="195" font-family="'Garamond', 'Georgia', serif" font-size="60" font-weight="bold"
          fill="url(#blueText)" text-anchor="middle" letter-spacing="6" filter="url(#glow)">GOURMAND</text>

    <!-- Sous-titre -->
    <text x="275" y="225" font-family="'Arial', sans-serif" font-size="14"
          fill="#0f3a5c" text-anchor="middle" letter-spacing="4" font-weight="300">TRAITEUR D'EXCEPTION</text>
    
    <!-- Ornements bas -->
    <g>
        <rect x="160" y="210" width="50" height="2" rx="1" fill="#ffffff" opacity="0.5"/>
        <rect x="340" y="210" width="50" height="2" rx="1" fill="#ffffff" opacity="0.5"/>
    </g>
</svg>